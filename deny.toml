[graph]
all-features = true
# The shipped OS triples only (4C Task 5): crates that only wasm32 or Android pull in
# (rustls-platform-verifier's webpki-root-certs, CDLA-Permissive-2.0) stay out of the graph.
# fin-core and fin-text also build for wasm32-unknown-unknown; their dependencies are the
# same on every target.
targets = [
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[licenses]
allow = [
  "MIT",
  # Public-domain-equivalent; interprocess's doctest-file and recvmsg (Windows) use it alone.
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
