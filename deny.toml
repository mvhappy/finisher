[graph]
all-features = true
# The shipped OS triples only (4C Task 5): crates that only wasm32 or Android pull in
# (rustls-platform-verifier's webpki-root-certs, CDLA-Permissive-2.0) stay out of the graph.
# fin-core and fin-text also build for wasm32-unknown-unknown; their dependencies are the
# same on every target.
targets = [
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[licenses]
allow = [
  "MIT",
  # Public-domain-equivalent; interprocess's doctest-file and recvmsg (Windows) use it alone.
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# RustSec advisories (review #46), from the maintained advisory database cargo-deny fetches
# (https://github.com/rustsec/advisory-db; `FIN_DENY_OFFLINE=1` uses the cached copy, `--offline`). Every
# vulnerability, notice and unmaintained crate fails the gate unless it is listed below
# with a reviewed reason. Bundled native engines (SQLite, ORT, codecs) are not covered by
# RustSec: see the release checklist and `crates/fin-store/tests/sqlite_engine.rs`.
[advisories]
yanked = "warn"
ignore = [
  # Reviewed 2026-11-09. No safe upgrade: cosmic-text 0.19.0 (latest) needs fontdb 0.23,
  # which parses faces with ttf-parser. Unmaintained, no known vulnerability; fonts are
  # parsed in the font scan/shaping path only. Follow-up: drop when cosmic-text moves off it.
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser via cosmic-text/fontdb; no maintained release of cosmic-text avoids it yet" },
  # Reviewed 2026-11-09. zbus 4 (keyring 3.6 / secret-service 4, Linux Secret Service only)
  # uses the standalone zvariant/zbus_names crates, merged into zbus 6; keyring 4 still uses
  # zbus 5 with them. Unmaintained, no known vulnerability. Follow-up: drop with zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 4 (keyring); merged into zbus 6, which no keyring release uses yet" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 4 (keyring); merged into zbus 6, which no keyring release uses yet" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 4 (keyring); merged into zbus 6, which no keyring release uses yet" },
]
