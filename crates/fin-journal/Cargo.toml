[package]
name = "fin-journal"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Fault injection for the journal's own tests and cost example (`Journal::faults`): pause,
# stall, fail or panic the writer. Never enable in production builds.
test-hooks = []

# Local I/O only: no network stack (`tests/journal.rs` `no_network_crates_in_tree`).
[dependencies]
fin-core = { path = "../fin-core" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"

[dev-dependencies]
fin-journal = { path = ".", features = ["test-hooks"] }
tempfile = "3"
