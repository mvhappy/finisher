[package]
name = "fin-journal"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Fault injection for the journal's own tests and cost example (`Journal::faults`): pause,
# stall, fail or panic the writer. Never enable in production builds.
test-hooks = []

# Local I/O only: no network stack (`tests/journal.rs` `no_network_crates_in_tree`).
[dependencies]
# The per-install keyed hash (Decision 6) and blob addresses (Decision 20).
blake3 = "1"
fin-core = { path = "../fin-core" }
# The install key's 32 random bytes.
getrandom = "0.3"
# Finding blob references in the files at open (already in the workspace's tree).
memchr = "2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"

[dev-dependencies]
fin-journal = { path = ".", features = ["test-hooks"] }
tempfile = "3"
