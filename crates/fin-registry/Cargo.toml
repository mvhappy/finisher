[package]
name = "fin-registry"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Plugin packages (strict reader, reproducible packer, tree hashes), install plans and the plugin store; from 8A Task 4a, TUF registries."

[dependencies]
blake3 = "1"
fin-plugin-api = { path = "../fin-plugin-api" }
schemars = { version = "1", features = ["semver1"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
unicode-normalization = "0.1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
# The hostile-archive corpus writes zip bytes by hand (tests/support/hostile.rs).
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tempfile = "3"
