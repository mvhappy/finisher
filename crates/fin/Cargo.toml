[package]
name = "fin"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The agent-only Finisher CLI."

[[bin]]
name = "fin"
path = "src/main.rs"

# Only for the self dev-dependency below (see the file).
[lib]
name = "fin_test_hooks_marker"
path = "src/test_hooks_marker.rs"
test = false
doctest = false

[features]
# `FIN_OFFLINE_SNAPSHOT` and `FIN_TEST_COMMIT_GATE` are read only with this feature (5A
# Decision 37). fin's own tests enable it through the self dev-dependency below; release
# builds never do (`scripts/check-test-hooks.mjs`).
test-hooks = []

[dependencies]
# No `color` or `help` features: fin never renders clap's own help or ANSI output.
# `--idem-key` commits carry the blake3 hash of the command input (`Tx.argsHash`).
blake3 = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "error-context", "suggestions", "usage"] }
fin-core = { path = "../fin-core" }
# `fin project rebuild` with no server running rebuilds the database in-process.
fin-store = { path = "../fin-store" }
# Unix domain sockets and Windows named pipes with blocking IO (0BSD OR Apache-2.0).
interprocess = "2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"

[dev-dependencies]
fin = { path = ".", features = ["test-hooks"] }
fin-probe = { path = "../fin-probe", features = ["fixtures"] }
fin-testfonts = { path = "../fin-testfonts" }
sha2 = "0.11"
tempfile = "3"
