[package]
name = "fin-compositor"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The render graph: geometry, coverage, mips, the CPU reference compositor and (6A-2) the wgpu compositor."

[dependencies]
fin-core = { path = "../fin-core" }
fin-media = { path = "../fin-media" }
# sin/cos/log2 on the hashed path (spec §13.4).
libm = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The wgpu compositor (6A-2): Metal, D3D12 and Vulkan natively, WebGPU on wasm32-unknown-unknown
# (spec §5.2, §5.3). Not on WASI, where the reference alone runs (the wasm32-wasip1 T0 runs).
[target.'cfg(not(target_os = "wasi"))'.dependencies]
pollster = "0.4"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "dx12", "vulkan", "webgpu"] }

[features]
# The CPU reference compositor (spec §13.2): the oracle GPU output is compared against.
reference = []

[dev-dependencies]
blake3 = "1"
fin-compositor = { path = ".", features = ["reference"] }
fin-media = { path = "../fin-media", features = ["testing"] }
libm = { workspace = true }
# Writes reference renders for inspection (FIN_REFERENCE_PNG).
png = "0.18"
