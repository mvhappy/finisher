[package]
name = "fin-sandbox"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The OS sandbox (sub-project 7C): one pure policy, the agent, hook, worker and plugin profiles, and root enumeration."

[features]
# Test-only parts (`ReadPolicy::Everything`, the `fin-sandbox-probe` binary; later the status
# stubs). Never enabled by a shipped build (`scripts/check-test-hooks.mjs`).
test-hooks = []

# Performs one named filesystem or network attempt under a policy and prints `{op, errno}`
# (the escape suites' probe, plan 7C Task 2).
[[bin]]
name = "fin-sandbox-probe"
path = "src/bin/fin-sandbox-probe.rs"
required-features = ["test-hooks"]

# The launcher for programs `finisherd` starts itself: agents and hooks (plan 7C Task 5).
[[bin]]
name = "fin-sandbox-exec"
path = "src/bin/fin-sandbox-exec.rs"

[dependencies]
fin-core = { path = "../fin-core" }
# `SelfSandbox`, the request the self-sandbox entry takes.
fin-jobs = { path = "../fin-jobs" }
# The `Spawner` trait `SandboxSpawner` implements (plan 7C Task 7).
fin-jobhost = { path = "../fin-jobhost" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
fin-sandbox = { path = ".", features = ["test-hooks"] }
proptest = "1"
tempfile = "3"

# Landlock (plan 7C Decision 10; MIT OR Apache-2.0) and the raw calls around it.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
