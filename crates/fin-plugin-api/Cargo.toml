[package]
name = "fin-plugin-api"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Plugin manifests, permissions, risks, licence classes and their validation (pure: no I/O, clock or randomness; builds for wasm32)."

[dependencies]
schemars = { version = "1", features = ["semver1"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spdx = { version = "0.13", default-features = false }
