[package]
name = "fin-workers"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The one worker binary: `fin-workers <family>` (5C-1)."

[[bin]]
name = "fin-workers"
path = "src/main.rs"

# Only for the self dev-dependency below (a binary-only package cannot be one).
[lib]
name = "fin_workers_test_hooks_marker"
path = "src/test_hooks_marker.rs"
test = false
doctest = false

[features]
# The `test`, `testbad` and `testplugin` families and the test helper. fin-workers' own tests
# enable it through the self dev-dependency below, and fin-node's `build:test` builds the
# binary with it; release builds never do (`scripts/check-test-hooks.mjs`).
test-hooks = ["fin-jobs/test-hooks", "dep:windows-sys"]

[dependencies]
fin-jobs = { path = "../fin-jobs" }
serde = "1"
serde_json = "1"

# The host watchdog (`fin-workers watchdog`), and the test family's signals, `setsid` and
# process reports.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# The test family's `EXCEPTION_IN_PAGE_ERROR` and its Job, breakaway and handle probes
# (test-hooks only).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    # `WriteFile` (its `OVERLAPPED` argument); without it only a workspace build, where another
    # crate enables it, compiles the test family.
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# The Windows process tests: Jobs, process state, pipes and handle flags.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
fin-core = { path = "../fin-core" }
fin-jobhost = { path = "../fin-jobhost", features = ["test-hooks"] }
fin-workers = { path = ".", features = ["test-hooks"] }
tempfile = "3"
