[package]
name = "fin-jobs"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The job envelope and the worker and helper runtimes (5C-1). Creates no process."

[features]
# The test kinds' params (`test_kinds`), the test-only `JobCtx` hooks and `Family::hello_for_test`.
# Enabled by `fin-workers/test-hooks` and `fin-node/test-hooks`, never in a shipped build.
test-hooks = []

[dependencies]
blake3 = "1.8.7"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The runtime's crash-UI suppression (Decision 6).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug", "Win32_System_ErrorReporting"] }

[dev-dependencies]
fin-core = { path = "../fin-core" }
fin-jobs = { path = ".", features = ["test-hooks"] }
