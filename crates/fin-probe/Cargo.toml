[package]
name = "fin-probe"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Exposes the `fixtures` writers so other crates' tests can generate media.
fixtures = []

[dependencies]
blake3 = "1"
dunce = "1"
# MP4/MOV media: sample tables, edit lists and limits (sub-project 6A Task 8); its muxer writes
# the fixtures.
fin-container = { path = "../fin-container" }
fin-core = { path = "../fin-core" }
fin-media = { path = "../fin-media" }
# Font faces, family names and script coverage: the one source (4C Decision 38).
fin-text = { path = "../fin-text" }
# PNG, JPEG and WebP sizes from the header only.
imagesize = { version = "0.15", default-features = false, features = ["png", "jpeg", "webp"] }
# SVG root sizes.
roxmltree = "0.21"
schemars = "1"
serde = { version = "1", features = ["derive"] }
# `raw_value`: a dotLottie animation's needed keys kept as text, the rest skipped.
serde_json = { version = "1", features = ["raw_value"] }
# A font asset's whole-file hash (4C Decision 37).
sha2 = "0.11"
# dotLottie archives (stored and deflated members).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Opening a probed file without blocking, beneath a root (`openat2`, `openat`, `fcntl`).
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# The final path of a probed file's handle (`GetFinalPathNameByHandleW`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# `tests/media.rs`: rotated, VFR and edited files from the muxer's test knobs.
fin-container = { path = "../fin-container", features = ["testing"] }
fin-probe = { path = ".", features = ["fixtures"] }
fin-testfonts = { path = "../fin-testfonts" }
tempfile = "3"
