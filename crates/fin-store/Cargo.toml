[package]
name = "fin-store"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Fault injection for crash tests (`Store::fail_next_commit_after_apply`). Never enable in
# production builds.
test-hooks = []

[dependencies]
blake3 = "1.8.7"
crc32c = "0.6.9"
fin-core = { path = "../fin-core" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
ulid = "1"

[dev-dependencies]
fin-store = { path = ".", features = ["test-hooks"] }
tempfile = "3"
