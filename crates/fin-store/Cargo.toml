[package]
name = "fin-store"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Fault injection for crash tests (`Store::fail_next_commit_after_apply`). Never enable in
# production builds.
test-hooks = []

[dependencies]
blake3 = "1.8.7"
crc32c = "0.6.8"
fin-core = { path = "../fin-core" }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
ulid = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_CloudFilters", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Time", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
# Only for `examples/export_schema.rs`, which puts `fin_probe::Probe` and the font wire types
# (`fin_fonts::{FontCatalog, FileState, FontsStatus, FontsPlan}`) in the TS contract.
fin-core = { path = "../fin-core", features = ["test-measurer"] }
fin-fonts = { path = "../fin-fonts" }
fin-probe = { path = "../fin-probe" }
fin-store = { path = ".", features = ["test-hooks"] }
# `tests/measure.rs`: real layouts from generated fonts.
fin-testfonts = { path = "../fin-testfonts" }
fin-text = { path = "../fin-text" }
proptest = "1"
tempfile = "3"
