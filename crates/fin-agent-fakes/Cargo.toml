[package]
name = "fin-agent-fakes"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Fake agent CLIs for tests (dev only; never shipped): fake-claude speaks Claude Code's stream-JSON and control protocol."

[lib]
path = "src/lib.rs"

[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"
