[package]
name = "fin-plugin-sdk"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Published to crates.io by sub-project 11's release work, not before.
publish = false
description = "The Rust SDK for Finisher code plugins: the fin-jobs envelope's plugin side, typed host calls and command handlers (sub-project 8B)."

[features]
# Readers and declared-size writers for cold kinds' `in/` and `out/` (8C onward); command-only
# plugins leave it off and do not link `fin-shm`.
files = ["dep:fin-shm"]

[dependencies]
fin-core = { path = "../fin-core" }
fin-jobs = { path = "../fin-jobs" }
fin-plugin-api = { path = "../fin-plugin-api" }
fin-shm = { path = "../fin-shm", optional = true }
serde_json = "1"
