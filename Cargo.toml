[workspace]
resolver = "3"
members = ["crates/*", "examples/plugins/rust-tools"]
# Everything but the cross-host harness, which enables `fin-store/test-hooks`: a build or test
# of the default members never unifies that feature into `fin` or `fin-node`
# (`scripts/check-test-hooks.mjs`). Build the harness alone: `cargo build -p fin-store-xhost`.
# The codecs (`fin-codecs`, `fin-svt-sys`, `fin-dav1d-sys`) are members since 6A-2's media
# worker links them: their SVT-AV1 and dav1d builds need cmake, nasm on x86_64 and the
# `third_party/svt-av1` and `third_party/dav1d` submodules. `fin-codecs`' own fixtures:
# `cargo test -p fin-codecs --features testing`.
# The plugin SDK, its harness and the example plugins (sub-project 8B) are members outside the
# defaults, like `fin-plugin-cli`: plugin authors' tooling, not part of the app; `--workspace`
# builds and tests them.
default-members = [
    "crates/fin",
    "crates/fin-codecs",
    "crates/fin-compositor",
    "crates/fin-container",
    "crates/fin-core",
    "crates/fin-dataset-inputs",
    "crates/fin-dav1d-sys",
    "crates/fin-fonts",
    "crates/fin-jobhost",
    "crates/fin-jobs",
    "crates/fin-journal",
    "crates/fin-library",
    "crates/fin-media",
    "crates/fin-node",
    "crates/fin-plugin-api",
    "crates/fin-probe",
    "crates/fin-registry",
    "crates/fin-sandbox",
    "crates/fin-shm",
    "crates/fin-store",
    "crates/fin-svt-sys",
    "crates/fin-testfonts",
    "crates/fin-text",
    "crates/fin-workers",
]

[workspace.dependencies]
# Pinned exactly (sub-project 6 spec §13.4): every crate whose output is hashed (plans' text
# layouts, the CPU reference compositor, the mixer) takes it from here. An update re-runs the
# T0 and A0 suites and bumps `RENDER_VERSION` if a hash moves.
libm = "=0.2.16"
# Platform codecs (sub-project 6B-1 plan Task 1): VideoToolbox, CoreMedia and CoreVideo on
# macOS through the objc2 bindings (the 0.3 line the tree's objc2-* take through wgpu; Zlib OR
# Apache-2.0 OR MIT), Media Foundation and D3D11 on Windows through `windows` (in the tree
# through wgpu; MIT OR Apache-2.0). `fin-codecs` takes them target-gated only.
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString", "CFData", "CFArray"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "objc2-core-video", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "CMFormatDescriptionBridge"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn"] }
objc2-video-toolbox = { version = "0.3", default-features = false, features = ["std", "objc2-core-media", "objc2-core-video", "VTBase", "VTSession", "VTErrors", "VTDecompressionSession", "VTDecompressionProperties", "VTCompressionSession", "VTCompressionProperties", "VTPixelTransferSession", "VTPixelTransferProperties", "VTUtilities", "VTVideoEncoderList"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/mvhappy/finisher"

# Debug and test builds keep line tables only (backtraces still show file:line), and
# dependencies carry no debug info. Full debug info made `target/debug` grow past 70 GB
# with several worktrees and agents building. Use `CARGO_PROFILE_DEV_DEBUG=full` for a
# debugger session.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
