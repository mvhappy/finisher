[workspace]
resolver = "3"
members = ["crates/*"]
# Everything but the cross-host harness, which enables `fin-store/test-hooks`: a build or test
# of the default members never unifies that feature into `fin` or `fin-node`
# (`scripts/check-test-hooks.mjs`). Build the harness alone: `cargo build -p fin-store-xhost`.
# Nor the codecs (`fin-codecs`, `fin-svt-sys`), whose SVT-AV1 build needs cmake, nasm on x86_64
# and the `third_party/svt-av1` submodule: `cargo test -p fin-codecs --features testing`. They
# join the default members when 6A-2's media worker needs them.
default-members = [
    "crates/fin",
    "crates/fin-compositor",
    "crates/fin-container",
    "crates/fin-core",
    "crates/fin-fonts",
    "crates/fin-jobhost",
    "crates/fin-jobs",
    "crates/fin-journal",
    "crates/fin-media",
    "crates/fin-node",
    "crates/fin-probe",
    "crates/fin-shm",
    "crates/fin-store",
    "crates/fin-testfonts",
    "crates/fin-text",
    "crates/fin-workers",
]

[workspace.dependencies]
# Pinned exactly (sub-project 6 spec §13.4): every crate whose output is hashed (plans' text
# layouts, the CPU reference compositor, the mixer) takes it from here. An update re-runs the
# T0 and A0 suites and bumps `RENDER_VERSION` if a hash moves.
libm = "=0.2.16"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/mvhappy/finisher"

# Debug and test builds keep line tables only (backtraces still show file:line), and
# dependencies carry no debug info. Full debug info made `target/debug` grow past 70 GB
# with several worktrees and agents building. Use `CARGO_PROFILE_DEV_DEBUG=full` for a
# debugger session.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The AV1 decoder runs pure Rust on aarch64 (fin-codecs/Cargo.toml); unoptimised, the codec
# tests would take minutes.
[profile.dev.package.rav1d]
opt-level = 3
